<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#dc2626">
    <title>Floorshare - Linha Branca</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Biblioteca para gerar PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body { font-family: 'Roboto', sans-serif; -webkit-tap-highlight-color: transparent; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        @page { size: A4; margin: 0; }
    </style>
</head>
<body class="bg-gray-100 pb-24">

    <header class="bg-red-600 text-white p-4 sticky top-0 z-50 shadow-md flex justify-between items-center">
        <div class="flex items-center gap-2">
            <i class=""></i>
            <h1 class="text-lg font-bold tracking-wide">Floorshare Linha Branca</h1>
        </div>
        <button id="reset-top" class="text-xs bg-red-700 hover:bg-red-800 px-3 py-1 rounded-full transition">
            <i class="fas fa-eraser mr-1"></i> Limpar
        </button>
    </header>

    <div class="container mx-auto p-4 max-w-md">
        
        <div class="bg-red-50 border-l-4 border-red-500 p-3 rounded-r mb-4 shadow-sm">
            <p class="text-red-800 text-xs font-bold uppercase tracking-wider mb-1">Introdução de Novo Produto na Rede</p>
            <h2 class="text-gray-800 font-bold text-sm">Linha Branca Panasonic</h2>
        </div>

        <div class="space-y-4">
            
            <div class="bg-white p-4 rounded-2xl shadow-sm">
                <h3 class="text-gray-400 text-xs font-bold uppercase tracking-wider mb-3 flex items-center">
                    <i class="fas fa-store mr-2"></i> Rede
                </h3>
                <div class="space-y-3">
                    <input type="text" id="rede" placeholder="Rede" class="w-full bg-gray-50 p-3 rounded-xl border-none focus:ring-2 focus:ring-red-500 text-gray-700 text-sm transition">
                    <div class="grid grid-cols-2 gap-3">
                        <input type="text" id="id-rede" placeholder="ID" class="w-full bg-gray-50 p-3 rounded-xl border-none focus:ring-2 focus:ring-red-500 text-gray-700 text-sm transition">
                        <input type="text" id="filial" placeholder="Filial" class="w-full bg-gray-50 p-3 rounded-xl border-none focus:ring-2 focus:ring-red-500 text-gray-700 text-sm transition">
                    </div>
                    <input type="text" id="cidade" placeholder="Cidade" class="w-full bg-gray-50 p-3 rounded-xl border-none focus:ring-2 focus:ring-red-500 text-gray-700 text-sm transition">
                </div>
            </div>

            <div class="bg-white p-4 rounded-2xl shadow-sm">
                <h3 class="text-gray-400 text-xs font-bold uppercase tracking-wider mb-3 flex items-center">
                    <i class="fas fa-box mr-2"></i> Produto
                </h3>
                <div class="space-y-3">
                    <input type="text" id="produto" placeholder="Produto" class="w-full bg-gray-50 p-3 rounded-xl border-none focus:ring-2 focus:ring-red-500 text-gray-700 text-sm transition">
                    <input type="text" id="preco" placeholder="Preço: R$" class="w-full bg-gray-50 p-3 rounded-xl border-none focus:ring-2 focus:ring-red-500 text-gray-700 text-sm transition">
                    <textarea id="especificacoes" placeholder="Especificações:" rows="3" class="w-full bg-gray-50 p-3 rounded-xl border-none focus:ring-2 focus:ring-red-500 text-gray-700 text-sm transition resize-none"></textarea>
                </div>
            </div>

            <div class="bg-white p-4 rounded-2xl shadow-sm">
                <h3 class="text-gray-400 text-xs font-bold uppercase tracking-wider mb-3 flex items-center">
                    <i class="fas fa-users mr-2"></i> Equipe
                </h3>
                <div class="space-y-3">
                    <input type="text" id="coordenador" placeholder="Coordenador" class="w-full bg-gray-50 p-3 rounded-xl border-none focus:ring-2 focus:ring-red-500 text-gray-700 text-sm transition">
                    <input type="text" id="consultor" placeholder="Consultor(a)" class="w-full bg-gray-50 p-3 rounded-xl border-none focus:ring-2 focus:ring-red-500 text-gray-700 text-sm transition">
                    <input type="text" id="regional" placeholder="Regional" class="w-full bg-gray-50 p-3 rounded-xl border-none focus:ring-2 focus:ring-red-500 text-gray-700 text-sm transition">
                    <div class="relative">
                        <span class="absolute left-3 top-3 text-gray-400 text-xs">Data</span>
                        <input type="date" id="data" class="w-full bg-gray-50 pt-6 pb-2 px-3 rounded-xl border-none focus:ring-2 focus:ring-red-500 text-gray-700 text-sm transition">
                    </div>
                </div>
            </div>

            <div class="bg-white p-4 rounded-2xl shadow-sm border-2 border-red-100">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-red-600 font-bold text-lg">Contagem Linha Branca</h3>
                    <div class="text-xs text-gray-400 bg-gray-100 px-2 py-1 rounded">
                        Panasonic no topo
                    </div>
                </div>
                
                <form id="product-form" class="space-y-3">
                    <div id="brands-container" class="space-y-3">
                        <!-- Primeira linha sempre Panasonic -->
                        <div class="flex items-center gap-2 brand-row">
                            <div class="relative w-full">
                                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                    <i class="fas fa-crown text-yellow-500"></i>
                                </div>
                                <input type="text" name="marca[]" value="Panasonic" readonly class="w-full pl-9 pr-3 py-3 bg-yellow-50 rounded-xl border border-yellow-200 text-gray-700 font-bold">
                            </div>
                            <input type="number" name="quantidade[]" placeholder="Qtd" class="w-20 py-3 text-center bg-gray-50 rounded-xl border border-gray-200 focus:border-red-500 focus:ring-1 focus:ring-red-500 outline-none transition" inputmode="numeric">
                        </div>
                        <!-- Outras marcas -->
                        <div class="flex items-center gap-2 brand-row">
                            <div class="relative w-full">
                                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                    <i class="fas fa-tag text-gray-300"></i>
                                </div>
                                <input type="text" name="marca[]" placeholder="Marca Concorrente" class="w-full pl-9 pr-3 py-3 bg-gray-50 rounded-xl border border-gray-200 focus:border-red-500 focus:ring-1 focus:ring-red-500 outline-none transition">
                            </div>
                            <input type="number" name="quantidade[]" placeholder="Qtd" class="w-20 py-3 text-center bg-gray-50 rounded-xl border border-gray-200 focus:border-red-500 focus:ring-1 focus:ring-red-500 outline-none transition" inputmode="numeric">
                        </div>
                    </div>
                    
                    <button type="button" id="add-brand" class="w-full mt-2 py-3 border-2 border-dashed border-gray-300 text-gray-500 rounded-xl hover:bg-gray-50 hover:border-red-400 hover:text-red-500 transition flex items-center justify-center gap-2 font-medium">
                        <i class="fas fa-plus"></i> Adicionar Marca Concorrente
                    </button>
                </form>
            </div>
        </div>
        
        <div class="h-8"></div>
    </div>

    <div id="result-modal" class="fixed inset-0 bg-black bg-opacity-50 z-[60] hidden flex items-end sm:items-center justify-center backdrop-blur-sm">
        <div class="bg-white w-full max-w-md sm:rounded-2xl rounded-t-2xl shadow-2xl transform transition-transform duration-300 max-h-[90vh] flex flex-col">
            
            <div class="p-4 border-b flex justify-between items-center bg-gray-50 rounded-t-2xl">
                <h3 class="font-bold text-gray-800">Relatório Gerado</h3>
                <button id="close-modal" class="text-gray-500 hover:text-gray-700 bg-gray-200 rounded-full w-8 h-8 flex items-center justify-center">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <div class="p-4 overflow-y-auto no-scrollbar">
                <div class="mb-4">
                    <h4 class="text-xs font-bold text-gray-400 uppercase mb-2">Resumo de Participação</h4>
                    <div id="visual-summary" class="bg-gray-50 rounded-xl p-3 text-sm space-y-1"></div>
                </div>

                <div>
                    <h4 class="text-xs font-bold text-gray-400 uppercase mb-2">Relatório Completo</h4>
                    <div id="pdf-preview" class="whitespace-pre-wrap text-xs bg-gray-50 text-gray-900 p-4 rounded-xl border border-gray-200 font-mono max-h-60 overflow-y-auto"></div>
                </div>
            </div>

            <div class="p-4 border-t bg-white flex gap-3">
                <button id="generate-pdf" class="flex-1 bg-red-600 text-white font-bold py-3 px-4 rounded-xl shadow-lg hover:bg-red-700 transition flex items-center justify-center gap-2">
                    <i class="fas fa-file-pdf"></i> Gerar PDF
                </button>
                <a id="whatsapp-link" href="#" target="_blank" class="flex-1 bg-green-500 text-white font-bold py-3 px-4 rounded-xl shadow-lg hover:bg-green-600 transition flex items-center justify-center gap-2">
                    <i class="fab fa-whatsapp text-xl"></i> WhatsApp
                </a>
            </div>
        </div>
    </div>

    <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 p-4 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)] z-40">
        <div class="max-w-md mx-auto">
            <button id="generate-report" class="w-full bg-red-600 text-white font-bold py-3 rounded-xl shadow-lg hover:bg-red-700 active:scale-95 transition flex items-center justify-center gap-2">
                <i class="fas fa-chart-bar mr-2"></i> Gerar Relatório
            </button>
        </div>
    </div>

    <script>
        const { jsPDF } = window.jspdf;
        document.getElementById('data').valueAsDate = new Date();

        document.getElementById('add-brand').addEventListener('click', function() {
            const container = document.getElementById('brands-container');
            const newRow = document.createElement('div');
            newRow.className = 'flex items-center gap-2 brand-row animate-fade-in';
            newRow.innerHTML = `
                <div class="relative w-full">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i class="fas fa-tag text-gray-300"></i>
                    </div>
                    <input type="text" name="marca[]" placeholder="Marca Concorrente" class="w-full pl-9 pr-3 py-3 bg-gray-50 rounded-xl border border-gray-200 focus:border-red-500 focus:ring-1 focus:ring-red-500 outline-none transition">
                </div>
                <input type="number" name="quantidade[]" placeholder="Qtd" class="w-20 py-3 text-center bg-gray-50 rounded-xl border border-gray-200 focus:border-red-500 focus:ring-1 focus:ring-red-500 outline-none transition" inputmode="numeric">
                <button type="button" class="remove-brand text-red-400 hover:text-red-600 p-2"><i class="fas fa-trash-alt"></i></button>
            `;
            container.appendChild(newRow);
            newRow.querySelector('input').focus();
        });

        document.getElementById('brands-container').addEventListener('click', function(e) {
            if (e.target.closest('.remove-brand')) {
                const row = e.target.closest('.brand-row');
                if (!row.querySelector('input[name="marca[]"]').value.includes('Panasonic')) {
                    row.remove();
                }
            }
        });

        function ordenarMarcas(marcas, quantidades) {
            const itens = marcas.map((marca, index) => ({
                marca: marca,
                quantidade: quantidades[index],
                originalIndex: index
            }));
            
            // Sempre Panasonic primeiro, depois outras marcas
            itens.sort((a, b) => {
                const isPanasonicA = a.marca.toUpperCase().includes('PANASONIC');
                const isPanasonicB = b.marca.toUpperCase().includes('PANASONIC');
                
                if (isPanasonicA && !isPanasonicB) return -1;
                if (!isPanasonicA && isPanasonicB) return 1;
                
                // Ordena por quantidade (decrescente) para outras marcas
                return b.quantidade - a.quantidade;
            });
            
            return { 
                marcasOrdenadas: itens.map(i => i.marca), 
                quantidadesOrdenadas: itens.map(i => i.quantidade) 
            };
        }

        function calcularPorcentagens(quantidades, total) {
            if (total === 0) return [];
            let porcentagens = quantidades.map(q => ({
                val: (q / total) * 100,
                int: Math.floor((q / total) * 100)
            }));
            
            let soma = porcentagens.reduce((acc, curr) => acc + curr.int, 0);
            let diff = 100 - soma;
            
            let sortedIndices = porcentagens.map((p, i) => ({ decimal: p.val - p.int, index: i }))
                .sort((a, b) => b.decimal - a.decimal);
            
            for (let i = 0; i < diff; i++) {
                porcentagens[sortedIndices[i].index].int++;
            }
            
            return porcentagens.map(p => p.int);
        }

        function formatarData(dataString) {
            if (!dataString) return new Date().toLocaleDateString('pt-BR');
            const [ano, mes, dia] = dataString.split('-');
            return `${dia}/${mes}/${ano}`;
        }

        function gerarRelatorioTexto(dados, marcasOrdenadas, quantidadesOrdenadas, porcentagens, total) {
            let relatorio = `*Introdução de Novo Produto na Rede*\n\n`;
            relatorio += `*Rede:*\n`;
            relatorio += `*ID:* ${dados.idRede}\n`;
            relatorio += `*Filial:* ${dados.filial}\n`;
            relatorio += `*Cidade:* ${dados.cidade}\n\n`;
            relatorio += `*Produto:* ${dados.produto}\n`;
            relatorio += `*Coordenador:* ${dados.coordenador}\n`;
            relatorio += `*Consultor(a):* ${dados.consultor}\n`;
            relatorio += `*Regional:* ${dados.regional}\n`;
            relatorio += `*Data:* ${dados.data}\n\n`;
            relatorio += `*Produto:*\n`;
            relatorio += `*Preço:* ${dados.preco}\n\n`;
            relatorio += `*Especificações:*\n${dados.especificacoes}\n\n`;
            relatorio += `*Participação no Ponto de Venda:*\n`;
            
            marcasOrdenadas.forEach((m, i) => {
                relatorio += `${m}: ${porcentagens[i]}% (${quantidadesOrdenadas[i]} unidades)\n`;
            });
            
            relatorio += `\n*Total de Produtos:* ${total}`;
            
            return relatorio;
        }

        async function gerarPDF(dados, marcasOrdenadas, quantidadesOrdenadas, porcentagens, total) {
            const pdf = new jsPDF('portrait', 'mm', 'a4');
            const pageWidth = pdf.internal.pageSize.width;
            
            // Cabeçalho
            pdf.setFillColor(220, 38, 38);
            pdf.rect(0, 0, pageWidth, 20, 'F');
            pdf.setTextColor(255, 255, 255);
            pdf.setFontSize(16);
            pdf.text('Introdução de Novo Produto na Rede', pageWidth / 2, 12, { align: 'center' });
            
            let y = 35;
            
            // Dados da Rede
            pdf.setTextColor(0, 0, 0);
            pdf.setFontSize(12);
            pdf.setFont(undefined, 'bold');
            pdf.text('DADOS DA REDE', 20, y);
            y += 8;
            
            pdf.setFont(undefined, 'normal');
            pdf.setFontSize(10);
            pdf.text(`Rede: ${dados.rede}`, 20, y);
            y += 6;
            pdf.text(`ID: ${dados.idRede}`, 20, y);
            y += 6;
            pdf.text(`Filial: ${dados.filial}`, 20, y);
            y += 6;
            pdf.text(`Cidade: ${dados.cidade}`, 20, y);
            y += 10;
            
            // Dados do Produto
            pdf.setFont(undefined, 'bold');
            pdf.text('PRODUTO', 20, y);
            y += 8;
            
            pdf.setFont(undefined, 'normal');
            pdf.text(`Produto: ${dados.produto}`, 20, y);
            y += 6;
            pdf.text(`Preço: ${dados.preco}`, 20, y);
            y += 6;
            pdf.text(`Coordenador: ${dados.coordenador}`, 20, y);
            y += 6;
            pdf.text(`Consultor(a): ${dados.consultor}`, 20, y);
            y += 6;
            pdf.text(`Regional: ${dados.regional}`, 20, y);
            y += 6;
            pdf.text(`Data: ${dados.data}`, 20, y);
            y += 10;
            
            // Especificações
            if (dados.especificacoes) {
                pdf.setFont(undefined, 'bold');
                pdf.text('ESPECIFICAÇÕES', 20, y);
                y += 8;
                
                pdf.setFont(undefined, 'normal');
                const specs = pdf.splitTextToSize(dados.especificacoes, pageWidth - 40);
                specs.forEach(line => {
                    if (y > 250) {
                        pdf.addPage();
                        y = 20;
                    }
                    pdf.text(line, 20, y);
                    y += 6;
                });
                y += 10;
            }
            
            // Participação de Mercado
            pdf.setFont(undefined, 'bold');
            pdf.text('PARTICIPAÇÃO NO PONTO DE VENDA', 20, y);
            y += 12;
            
            // Tabela
            const startX = 20;
            let tableY = y;
            
            pdf.setFillColor(240, 240, 240);
            pdf.rect(startX, tableY, pageWidth - 40, 8, 'F');
            pdf.setFontSize(9);
            pdf.setTextColor(0, 0, 0);
            pdf.text('Marca', startX + 2, tableY + 6);
            pdf.text('Quantidade', startX + 100, tableY + 6);
            pdf.text('Participação', startX + 140, tableY + 6);
            
            tableY += 8;
            
            marcasOrdenadas.forEach((marca, i) => {
                if (tableY > 270) {
                    pdf.addPage();
                    tableY = 20;
                }
                
                // Destaque para Panasonic
                if (marca.toUpperCase().includes('PANASONIC')) {
                    pdf.setFillColor(255, 253, 231);
                    pdf.rect(startX, tableY, pageWidth - 40, 8, 'F');
                }
                
                pdf.setFont(undefined, marca.toUpperCase().includes('PANASONIC') ? 'bold' : 'normal');
                pdf.text(marca, startX + 2, tableY + 6);
                pdf.text(quantidadesOrdenadas[i].toString(), startX + 100, tableY + 6);
                pdf.text(`${porcentagens[i]}%`, startX + 140, tableY + 6);
                
                // Barra de participação
                const barWidth = (porcentagens[i] / 100) * 80;
                pdf.setFillColor(220, 38, 38, 0.3);
                pdf.rect(startX + 150, tableY + 2, barWidth, 4, 'F');
                
                tableY += 8;
            });
            
            // Total
            tableY += 5;
            pdf.setDrawColor(0, 0, 0);
            pdf.setLineWidth(0.5);
            pdf.line(startX, tableY, startX + (pageWidth - 40), tableY);
            tableY += 8;
            
            pdf.setFont(undefined, 'bold');
            pdf.setFontSize(11);
            pdf.text(`TOTAL: ${total} produtos`, startX + 2, tableY);
            
            pdf.save(`relatorio_linha_branca_${dados.data.replace(/\//g, '_')}.pdf`);
        }

        document.getElementById('generate-report').addEventListener('click', function() {
            const inputsMarcas = document.querySelectorAll('input[name="marca[]"]');
            const inputsQtd = document.querySelectorAll('input[name="quantidade[]"]');
            
            let marcas = [], quantidades = [], total = 0;
            
            inputsMarcas.forEach((input, i) => {
                const m = input.value.trim();
                const q = parseInt(inputsQtd[i].value) || 0;
                if (m && q > 0) {
                    marcas.push(m);
                    quantidades.push(q);
                    total += q;
                }
            });

            if (total === 0) {
                alert("Por favor, adicione pelo menos uma marca com quantidade válida.");
                return;
            }

            const { marcasOrdenadas, quantidadesOrdenadas } = ordenarMarcas(marcas, quantidades);
            const porcentagens = calcularPorcentagens(quantidadesOrdenadas, total);

            const dados = {
                rede: document.getElementById('rede').value,
                idRede: document.getElementById('id-rede').value,
                filial: document.getElementById('filial').value,
                cidade: document.getElementById('cidade').value,
                produto: document.getElementById('produto').value,
                preco: document.getElementById('preco').value || "Não informado",
                coordenador: document.getElementById('coordenador').value,
                consultor: document.getElementById('consultor').value,
                regional: document.getElementById('regional').value,
                data: formatarData(document.getElementById('data').value),
                especificacoes: document.getElementById('especificacoes').value
            };

            // Atualizar visual summary
            const visualDiv = document.getElementById('visual-summary');
            visualDiv.innerHTML = '';
            marcasOrdenadas.forEach((m, i) => {
                const isPanasonic = m.toUpperCase().includes('PANASONIC');
                visualDiv.innerHTML += `
                    <div class="flex justify-between items-center border-b border-gray-200 last:border-0 pb-1 mb-1 ${isPanasonic ? 'bg-yellow-50 px-2 -mx-2 rounded' : ''}">
                        <span class="font-medium ${isPanasonic ? 'text-yellow-700 font-bold' : 'text-gray-700'}">${m}</span>
                        <div class="text-right">
                            <span class="text-xs text-gray-500">${quantidadesOrdenadas[i]}un</span>
                            <span class="font-bold ${isPanasonic ? 'text-yellow-600' : 'text-red-600'} ml-2">${porcentagens[i]}%</span>
                        </div>
                    </div>
                `;
            });
            visualDiv.innerHTML += `<div class="mt-2 text-right font-bold text-gray-800 border-t pt-2">Total: ${total} produtos</div>`;

            // Gerar relatório completo
            const relatorioTexto = gerarRelatorioTexto(dados, marcasOrdenadas, quantidadesOrdenadas, porcentagens, total);
            document.getElementById('pdf-preview').textContent = relatorioTexto;
            
            // Atualizar link do WhatsApp
            const textoWhatsApp = relatorioTexto.replace(/\*/g, '*');
            document.getElementById('whatsapp-link').href = `https://wa.me/?text=${encodeURIComponent(textoWhatsApp)}`;
            
            // Configurar evento para gerar PDF
            document.getElementById('generate-pdf').onclick = () => {
                gerarPDF(dados, marcasOrdenadas, quantidadesOrdenadas, porcentagens, total);
            };

            document.getElementById('result-modal').classList.remove('hidden');
        });

        document.getElementById('close-modal').addEventListener('click', () => {
            document.getElementById('result-modal').classList.add('hidden');
        });

        document.getElementById('reset-top').addEventListener('click', () => {
            if(confirm('Limpar todos os campos?')) {
                document.querySelectorAll('input[type="text"], input[type="number"], textarea').forEach(el => {
                    if (!el.name || !el.value.includes('Panasonic')) {
                        el.value = '';
                    }
                });
                document.getElementById('data').valueAsDate = new Date();
                
                // Manter apenas Panasonic e uma linha vazia
                const container = document.getElementById('brands-container');
                container.innerHTML = `
                    <div class="flex items-center gap-2 brand-row">
                        <div class="relative w-full">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <i class="fas fa-crown text-yellow-500"></i>
                            </div>
                            <input type="text" name="marca[]" value="Panasonic" readonly class="w-full pl-9 pr-3 py-3 bg-yellow-50 rounded-xl border border-yellow-200 text-gray-700 font-bold">
                        </div>
                        <input type="number" name="quantidade[]" placeholder="Qtd" class="w-20 py-3 text-center bg-gray-50 rounded-xl border border-gray-200 focus:border-red-500 focus:ring-1 focus:ring-red-500 outline-none transition" inputmode="numeric">
                    </div>
                    <div class="flex items-center gap-2 brand-row">
                        <div class="relative w-full">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
