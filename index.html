<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#dc2626">
    <title>Floorshare - Linha Branca</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Biblioteca para gerar PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body { font-family: 'Roboto', sans-serif; -webkit-tap-highlight-color: transparent; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        @page { size: A4; margin: 0; }
        .category-badge { 
            background: linear-gradient(135deg, #f3f4f6 0%, #e5e7eb 100%);
            border: 1px solid #d1d5db;
        }
    </style>
</head>
<body class="bg-gray-100 pb-24">

    <header class="bg-red-600 text-white p-4 sticky top-0 z-50 shadow-md flex justify-between items-center">
        <div class="flex items-center gap-2">
            <h1 class="text-lg font-bold tracking-wide">Floorshare Linha Branca</h1>
        </div>
        <button id="reset-top" class="text-xs bg-red-700 hover:bg-red-800 px-3 py-1 rounded-full transition">
            <i class="fas fa-eraser mr-1"></i> Limpar
        </button>
    </header>

    <div class="container mx-auto p-4 max-w-md">
        
        <div class="bg-red-50 border-l-4 border-red-500 p-3 rounded-r mb-4 shadow-sm">
            <p class="text-red-800 text-xs font-bold uppercase tracking-wider mb-1">Floorshare Linha Branca</p>
            <h2 class="text-gray-800 font-bold text-sm">Controle de Participação por Marca</h2>
        </div>

        <div class="space-y-4">
            
            <div class="bg-white p-4 rounded-2xl shadow-sm">
                <h3 class="text-gray-400 text-xs font-bold uppercase tracking-wider mb-3 flex items-center">
                    <i class="fas fa-store mr-2"></i> Rede
                </h3>
                <div class="space-y-3">
                    <input type="text" id="rede" placeholder="Rede" class="w-full bg-gray-50 p-3 rounded-xl border-none focus:ring-2 focus:ring-red-500 text-gray-700 text-sm transition">
                    <div class="grid grid-cols-2 gap-3">
                        <input type="text" id="id-rede" placeholder="ID" class="w-full bg-gray-50 p-3 rounded-xl border-none focus:ring-2 focus:ring-red-500 text-gray-700 text-sm transition">
                        <input type="text" id="filial" placeholder="Filial" class="w-full bg-gray-50 p-3 rounded-xl border-none focus:ring-2 focus:ring-red-500 text-gray-700 text-sm transition">
                    </div>
                    <input type="text" id="cidade" placeholder="Cidade" class="w-full bg-gray-50 p-3 rounded-xl border-none focus:ring-2 focus:ring-red-500 text-gray-700 text-sm transition">
                </div>
            </div>

            <div class="bg-white p-4 rounded-2xl shadow-sm">
                <h3 class="text-gray-400 text-xs font-bold uppercase tracking-wider mb-3 flex items-center">
                    <i class="fas fa-users mr-2"></i> Equipe
                </h3>
                <div class="space-y-3">
                    <input type="text" id="coordenador" placeholder="Coordenador" class="w-full bg-gray-50 p-3 rounded-xl border-none focus:ring-2 focus:ring-red-500 text-gray-700 text-sm transition">
                    <input type="text" id="consultor" placeholder="Consultor(a)" class="w-full bg-gray-50 p-3 rounded-xl border-none focus:ring-2 focus:ring-red-500 text-gray-700 text-sm transition">
                    <input type="text" id="regional" placeholder="Regional" class="w-full bg-gray-50 p-3 rounded-xl border-none focus:ring-2 focus:ring-red-500 text-gray-700 text-sm transition">
                    <div class="relative">
                        <span class="absolute left-3 top-3 text-gray-400 text-xs">Data</span>
                        <input type="date" id="data" class="w-full bg-gray-50 pt-6 pb-2 px-3 rounded-xl border-none focus:ring-2 focus:ring-red-500 text-gray-700 text-sm transition">
                    </div>
                </div>
            </div>

            <div class="bg-white p-4 rounded-2xl shadow-sm border-2 border-red-100">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-red-600 font-bold text-lg">Contagem por Categoria</h3>
                    <div class="text-xs text-gray-400 bg-gray-100 px-2 py-1 rounded">
                        Panasonic primeiro
                    </div>
                </div>
                
                <div class="space-y-4" id="brands-container">
                    <!-- Panasonic fixo no topo -->
                    <div class="brand-category bg-yellow-50 border border-yellow-200 rounded-xl p-4">
                        <div class="flex items-center mb-3">
                            <div class="relative w-full">
                                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                    <i class="fas fa-crown text-yellow-500"></i>
                                </div>
                                <input type="text" value="Panasonic" readonly class="w-full pl-9 pr-3 py-3 bg-transparent rounded-xl border-none text-gray-700 font-bold">
                            </div>
                        </div>
                        
                        <div class="grid grid-cols-2 gap-3 mb-2">
                            <div class="category-badge rounded-lg p-3 text-center">
                                <label class="text-xs text-gray-500 font-medium mb-1 block">Lavadoras</label>
                                <input type="number" data-marca="Panasonic" data-categoria="lavadoras" placeholder="0" class="w-full text-center bg-transparent border-none text-lg font-bold text-gray-700 focus:outline-none" inputmode="numeric">
                            </div>
                            <div class="category-badge rounded-lg p-3 text-center">
                                <label class="text-xs text-gray-500 font-medium mb-1 block">Refrigeradores</label>
                                <input type="number" data-marca="Panasonic" data-categoria="refrigeradores" placeholder="0" class="w-full text-center bg-transparent border-none text-lg font-bold text-gray-700 focus:outline-none" inputmode="numeric">
                            </div>
                        </div>
                        <div class="text-xs text-gray-400 text-center mt-1">
                            <i class="fas fa-info-circle mr-1"></i>Marca principal
                        </div>
                    </div>
                    
                    <!-- Outras marcas serão adicionadas aqui -->
                </div>
                
                <button type="button" id="add-brand" class="w-full mt-4 py-3 border-2 border-dashed border-gray-300 text-gray-500 rounded-xl hover:bg-gray-50 hover:border-red-400 hover:text-red-500 transition flex items-center justify-center gap-2 font-medium">
                    <i class="fas fa-plus"></i> Adicionar Marca Concorrente
                </button>
            </div>
            
            <div class="bg-white p-4 rounded-2xl shadow-sm">
                <h3 class="text-gray-400 text-xs font-bold uppercase tracking-wider mb-3 flex items-center">
                    <i class="fas fa-info-circle mr-2"></i> Observações
                </h3>
                <textarea id="observacoes" placeholder="Observações adicionais..." rows="2" class="w-full bg-gray-50 p-3 rounded-xl border-none focus:ring-2 focus:ring-red-500 text-gray-700 text-sm transition resize-none"></textarea>
            </div>
        </div>
        
        <div class="h-8"></div>
    </div>

    <div id="result-modal" class="fixed inset-0 bg-black bg-opacity-50 z-[60] hidden flex items-end sm:items-center justify-center backdrop-blur-sm">
        <div class="bg-white w-full max-w-md sm:rounded-2xl rounded-t-2xl shadow-2xl transform transition-transform duration-300 max-h-[90vh] flex flex-col">
            
            <div class="p-4 border-b flex justify-between items-center bg-gray-50 rounded-t-2xl">
                <h3 class="font-bold text-gray-800">Relatório Gerado</h3>
                <button id="close-modal" class="text-gray-500 hover:text-gray-700 bg-gray-200 rounded-full w-8 h-8 flex items-center justify-center">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <div class="p-4 overflow-y-auto no-scrollbar">
                <div class="mb-4">
                    <h4 class="text-xs font-bold text-gray-400 uppercase mb-2">Resumo por Marca</h4>
                    <div id="visual-summary" class="bg-gray-50 rounded-xl p-3 text-sm space-y-3"></div>
                </div>

                <div>
                    <h4 class="text-xs font-bold text-gray-400 uppercase mb-2">Relatório Completo</h4>
                    <div id="pdf-preview" class="whitespace-pre-wrap text-xs bg-gray-50 text-gray-900 p-4 rounded-xl border border-gray-200 font-mono max-h-60 overflow-y-auto"></div>
                </div>
            </div>

            <div class="p-4 border-t bg-white flex gap-3">
                <button id="generate-pdf" class="flex-1 bg-red-600 text-white font-bold py-3 px-4 rounded-xl shadow-lg hover:bg-red-700 transition flex items-center justify-center gap-2">
                    <i class="fas fa-file-pdf"></i> Gerar PDF
                </button>
                <a id="whatsapp-link" href="#" target="_blank" class="flex-1 bg-green-500 text-white font-bold py-3 px-4 rounded-xl shadow-lg hover:bg-green-600 transition flex items-center justify-center gap-2">
                    <i class="fab fa-whatsapp text-xl"></i> WhatsApp
                </a>
            </div>
        </div>
    </div>

    <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 p-4 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)] z-40">
        <div class="max-w-md mx-auto">
            <button id="generate-report" class="w-full bg-red-600 text-white font-bold py-3 rounded-xl shadow-lg hover:bg-red-700 active:scale-95 transition flex items-center justify-center gap-2">
                <i class="fas fa-chart-bar mr-2"></i> Gerar Relatório
            </button>
        </div>
    </div>

    <script>
        const { jsPDF } = window.jspdf;
        document.getElementById('data').valueAsDate = new Date();

        // Template para marcas concorrentes
        const competitorTemplate = (brandName) => `
            <div class="brand-category bg-gray-50 border border-gray-200 rounded-xl p-4 relative">
                <button type="button" class="remove-brand absolute top-2 right-2 text-red-400 hover:text-red-600 p-1">
                    <i class="fas fa-times"></i>
                </button>
                <div class="flex items-center mb-3">
                    <div class="relative w-full">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fas fa-tag text-gray-400"></i>
                        </div>
                        <input type="text" value="${brandName}" class="brand-name w-full pl-9 pr-3 py-3 bg-white rounded-xl border border-gray-300 focus:border-red-500 focus:ring-1 focus:ring-red-500 outline-none transition text-gray-700" placeholder="Nome da Marca">
                    </div>
                </div>
                
                <div class="grid grid-cols-2 gap-3">
                    <div class="category-badge rounded-lg p-3 text-center">
                        <label class="text-xs text-gray-500 font-medium mb-1 block">Lavadoras</label>
                        <input type="number" data-marca="${brandName}" data-categoria="lavadoras" placeholder="0" class="w-full text-center bg-transparent border-none text-lg font-bold text-gray-700 focus:outline-none" inputmode="numeric">
                    </div>
                    <div class="category-badge rounded-lg p-3 text-center">
                        <label class="text-xs text-gray-500 font-medium mb-1 block">Refrigeradores</label>
                        <input type="number" data-marca="${brandName}" data-categoria="refrigeradores" placeholder="0" class="w-full text-center bg-transparent border-none text-lg font-bold text-gray-700 focus:outline-none" inputmode="numeric">
                    </div>
                </div>
            </div>
        `;

        // Adicionar marca concorrente
        document.getElementById('add-brand').addEventListener('click', function() {
            const container = document.getElementById('brands-container');
            const newBrand = document.createElement('div');
            newBrand.className = 'animate-fade-in';
            newBrand.innerHTML = competitorTemplate(`Marca ${container.children.length}`);
            container.appendChild(newBrand);
            newBrand.querySelector('.brand-name').focus();
        });

        // Remover marca (exceto Panasonic)
        document.getElementById('brands-container').addEventListener('click', function(e) {
            if (e.target.closest('.remove-brand')) {
                const brandDiv = e.target.closest('.brand-category');
                if (!brandDiv.querySelector('.brand-name') || !brandDiv.querySelector('.brand-name').value.includes('Panasonic')) {
                    brandDiv.remove();
                }
            }
        });

        // Coletar dados das marcas
        function coletarDadosMarcas() {
            const brandsData = {};
            const inputs = document.querySelectorAll('#brands-container input[data-marca]');
            
            inputs.forEach(input => {
                const marca = input.dataset.marca;
                const categoria = input.dataset.categoria;
                const quantidade = parseInt(input.value) || 0;
                
                if (!brandsData[marca]) {
                    brandsData[marca] = {
                        lavadoras: 0,
                        refrigeradores: 0,
                        total: 0
                    };
                }
                
                brandsData[marca][categoria] = quantidade;
                brandsData[marca].total += quantidade;
            });
            
            // Atualizar nomes das marcas dos inputs dinâmicos
            document.querySelectorAll('#brands-container .brand-category:not(:first-child) .brand-name').forEach(input => {
                const marcaAtual = input.dataset.marca;
                const novaMarca = input.value.trim() || marcaAtual;
                
                if (brandsData[marcaAtual] && marcaAtual !== novaMarca) {
                    brandsData[novaMarca] = brandsData[marcaAtual];
                    delete brandsData[marcaAtual];
                    
                    // Atualizar data-marca nos inputs de quantidade
                    const brandDiv = input.closest('.brand-category');
                    brandDiv.querySelectorAll('input[type="number"]').forEach(numInput => {
                        numInput.dataset.marca = novaMarca;
                    });
                }
            });
            
            return brandsData;
        }

        function calcularTotais(brandsData) {
            let totalGeral = 0;
            let totalLavadoras = 0;
            let totalRefrigeradores = 0;
            
            Object.values(brandsData).forEach(data => {
                totalLavadoras += data.lavadoras;
                totalRefrigeradores += data.refrigeradores;
                totalGeral += data.total;
            });
            
            return { totalGeral, totalLavadoras, totalRefrigeradores };
        }

        function calcularPorcentagem(valor, total) {
            return total > 0 ? Math.round((valor / total) * 100) : 0;
        }

        function formatarData(dataString) {
            if (!dataString) return new Date().toLocaleDateString('pt-BR');
            const [ano, mes, dia] = dataString.split('-');
            return `${dia}/${mes}/${ano}`;
        }

        function gerarResumoVisual(brandsData, totais) {
            let html = '';
            
            // Ordenar marcas (Panasonic primeiro, depois por total)
            const marcasOrdenadas = Object.entries(brandsData)
                .sort(([nomeA, dataA], [nomeB, dataB]) => {
                    if (nomeA.toUpperCase().includes('PANASONIC')) return -1;
                    if (nomeB.toUpperCase().includes('PANASONIC')) return 1;
                    return dataB.total - dataA.total;
                });
            
            marcasOrdenadas.forEach(([marca, data]) => {
                const isPanasonic = marca.toUpperCase().includes('PANASONIC');
                const pctTotal = calcularPorcentagem(data.total, totais.totalGeral);
                const pctLav = calcularPorcentagem(data.lavadoras, totais.totalLavadoras);
                const pctRef = calcularPorcentagem(data.refrigeradores, totais.totalRefrigeradores);
                
                html += `
                    <div class="${isPanasonic ? 'bg-yellow-50 border-l-4 border-yellow-400' : 'bg-white'} p-3 rounded-lg mb-2">
                        <div class="flex justify-between items-center mb-2">
                            <span class="font-bold ${isPanasonic ? 'text-yellow-700' : 'text-gray-700'}">${marca}</span>
                            <span class="font-bold text-red-600">${pctTotal}%</span>
                        </div>
                        <div class="grid grid-cols-2 gap-2 text-xs">
                            <div class="text-center">
                                <div class="text-gray-500">Lavadoras</div>
                                <div class="font-semibold">${data.lavadoras} <span class="text-blue-600">(${pctLav}%)</span></div>
                            </div>
                            <div class="text-center">
                                <div class="text-gray-500">Refrigeradores</div>
                                <div class="font-semibold">${data.refrigeradores} <span class="text-green-600">(${pctRef}%)</span></div>
                            </div>
                        </div>
                    </div>
                `;
            });
            
            html += `
                <div class="mt-3 pt-3 border-t border-gray-300">
                    <div class="grid grid-cols-3 gap-2 text-center text-sm">
                        <div>
                            <div class="text-gray-500">Total Geral</div>
                            <div class="font-bold text-lg text-gray-800">${totais.totalGeral}</div>
                        </div>
                        <div>
                            <div class="text-gray-500">Lavadoras</div>
                            <div class="font-bold text-lg text-blue-600">${totais.totalLavadoras}</div>
                        </div>
                        <div>
                            <div class="text-gray-500">Refrigeradores</div>
                            <div class="font-bold text-lg text-green-600">${totais.totalRefrigeradores}</div>
                        </div>
                    </div>
                </div>
            `;
            
            return html;
        }

        function gerarRelatorioTexto(dados, brandsData, totais) {
            let relatorio = `*FLOORSHARE LINHA BRANCA*\n\n`;
            relatorio += `*Rede:* ${dados.rede}\n`;
            relatorio += `*ID:* ${dados.idRede}\n`;
            relatorio += `*Filial:* ${dados.filial}\n`;
            relatorio += `*Cidade:* ${dados.cidade}\n`;
            relatorio += `*Coordenador:* ${dados.coordenador}\n`;
            relatorio += `*Consultor(a):* ${dados.consultor}\n`;
            relatorio += `*Regional:* ${dados.regional}\n`;
            relatorio += `*Data:* ${dados.data}\n\n`;
            
            if (dados.observacoes) {
                relatorio += `*Observações:*\n${dados.observacoes}\n\n`;
            }
            
            relatorio += `*PARTICIPAÇÃO POR MARCA*\n`;
            relatorio += `═`.repeat(30) + `\n`;
            
            // Ordenar marcas
            const marcasOrdenadas = Object.entries(brandsData)
                .sort(([nomeA, dataA], [nomeB, dataB]) => {
                    if (nomeA.toUpperCase().includes('PANASONIC')) return -1;
                    if (nomeB.toUpperCase().includes('PANASONIC')) return 1;
                    return dataB.total - dataA.total;
                });
            
            marcasOrdenadas.forEach(([marca, data]) => {
                const pctTotal = calcularPorcentagem(data.total, totais.totalGeral);
                relatorio += `\n*${marca}* - ${pctTotal}%\n`;
                relatorio += `  Lavadoras: ${data.lavadoras} (${calcularPorcentagem(data.lavadoras, totais.totalLavadoras)}%)\n`;
                relatorio += `  Refrigeradores: ${data.refrigeradores} (${calcularPorcentagem(data.refrigeradores, totais.totalRefrigeradores)}%)\n`;
            });
            
            relatorio += `\n` + `═`.repeat(30) + `\n`;
            relatorio += `*TOTAIS GERAIS*\n`;
            relatorio += `Total de Produtos: ${totais.totalGeral}\n`;
            relatorio += `Lavadoras: ${totais.totalLavadoras}\n`;
            relatorio += `Refrigeradores: ${totais.totalRefrigeradores}\n`;
            relatorio += `\n_Relatório gerado em ${new Date().toLocaleString('pt-BR')}_`;
            
            return relatorio;
        }

        async function gerarPDF(dados, brandsData, totais) {
            const pdf = new jsPDF('portrait', 'mm', 'a4');
            const pageWidth = pdf.internal.pageSize.width;
            
            // Cabeçalho com FLOORSHARE
            pdf.setFillColor(220, 38, 38);
            pdf.rect(0, 0, pageWidth, 25, 'F');
            pdf.setTextColor(255, 255, 255);
            pdf.setFontSize(20);
            pdf.setFont(undefined, 'bold');
            pdf.text('FLOORSHARE LINHA BRANCA', pageWidth / 2, 15, { align: 'center' });
            
            pdf.setFontSize(10);
            pdf.text('Relatório de Participação no Ponto de Venda', pageWidth / 2, 22, { align: 'center' });
            
            let y = 35;
            
            // Dados da Rede
            pdf.setTextColor(0, 0, 0);
            pdf.setFontSize(12);
            pdf.setFont(undefined, 'bold');
            pdf.text('DADOS DA REDE', 20, y);
            y += 8;
            
            pdf.setFont(undefined, 'normal');
            pdf.setFontSize(10);
            pdf.text(`Rede: ${dados.rede}`, 20, y);
            y += 6;
            pdf.text(`ID: ${dados.idRede}`, 20, y);
            y += 6;
            pdf.text(`Filial: ${dados.filial}`, 20, y);
            y += 6;
            pdf.text(`Cidade: ${dados.cidade}`, 20, y);
            y += 10;
            
            // Dados da Equipe
            pdf.setFont(undefined, 'bold');
            pdf.text('EQUIPE', 20, y);
            y += 8;
            
            pdf.setFont(undefined, 'normal');
            pdf.text(`Coordenador: ${dados.coordenador}`, 20, y);
            y += 6;
            pdf.text(`Consultor(a): ${dados.consultor}`, 20, y);
            y += 6;
            pdf.text(`Regional: ${dados.regional}`, 20, y);
            y += 6;
            pdf.text(`Data: ${dados.data}`, 20, y);
            y += 15;
            
            // Observações
            if (dados.observacoes) {
                pdf.setFont(undefined, 'bold');
                pdf.text('OBSERVAÇÕES', 20, y);
                y += 8;
                
                pdf.setFont(undefined, 'normal');
                const obsLines = pdf.splitTextToSize(dados.observacoes, pageWidth - 40);
                obsLines.forEach(line => {
                    if (y > 250) {
                        pdf.addPage();
                        y = 20;
                    }
                    pdf.text(line, 20, y);
                    y += 5;
                });
                y += 10;
            }
            
            // Tabela de Participação
            pdf.setFont(undefined, 'bold');
            pdf.setFontSize(14);
            pdf.text('PARTICIPAÇÃO POR MARCA', pageWidth / 2, y, { align: 'center' });
            y += 10;
            
            // Ordenar marcas
            const marcasOrdenadas = Object.entries(brandsData)
                .sort(([nomeA, dataA], [nomeB, dataB]) => {
                    if (nomeA.toUpperCase().includes('PANASONIC')) return -1;
                    if (nomeB.toUpperCase().includes('PANASONIC')) return 1;
                    return dataB.total - dataA.total;
                });
            
            const startX = 20;
            let tableY = y;
            
            // Cabeçalho da tabela
            pdf.setFillColor(240, 240, 240);
            pdf.rect(startX, tableY, pageWidth - 40, 8, 'F');
            pdf.setFontSize(9);
            pdf.setTextColor(0, 0, 0);
            pdf.text('Marca', startX + 2, tableY + 6);
            pdf.text('Lavadoras', startX + 50, tableY + 6);
            pdf.text('Refrigeradores', startX + 85, tableY + 6);
            pdf.text('Total', startX + 130, tableY + 6);
            pdf.text('%', startX + 155, tableY + 6);
            
            tableY += 10;
            
            // Dados das marcas
            marcasOrdenadas.forEach(([marca, data]) => {
                if (tableY > 270) {
                    pdf.addPage();
                    tableY = 20;
                }
                
                const isPanasonic = marca.toUpperCase().includes('PANASONIC');
                
                if (isPanasonic) {
                    pdf.setFillColor(255, 253, 231);
                    pdf.rect(startX, tableY - 2, pageWidth - 40, 10, 'F');
                }
                
                pdf.setFont(undefined, isPanasonic ? 'bold' : 'normal');
                pdf.text(marca, startX + 2, tableY + 6);
                pdf.text(data.lavadoras.toString(), startX + 50, tableY + 6);
                pdf.text(data.refrigeradores.toString(), startX + 85, tableY + 6);
                pdf.text(data.total.toString(), startX + 130, tableY + 6);
                
                const pctTotal = calcularPorcentagem(data.total, totais.totalGeral);
                pdf.text(`${pctTotal}%`, startX + 155, tableY + 6);
                
                // Barra de participação
                const barWidth = (pctTotal / 100) * 30;
                pdf.setFillColor(220, 38, 38, isPanasonic ? 0.5 : 0.3);
                pdf.rect(startX + 160, tableY + 2, barWidth, 4, 'F');
                
                tableY += 10;
            });
            
            // Totais
            tableY += 5;
            pdf.setDrawColor(0, 0, 0);
            pdf.setLineWidth(0.5);
            pdf.line(startX, tableY, startX + (pageWidth - 40), tableY);
            tableY += 10;
            
            pdf.setFont(undefined, 'bold');
            pdf.setFontSize(11);
            pdf.text('TOTAIS GERAIS:', startX + 2, tableY);
            pdf.text(`${totais.totalGeral}`, startX + 130, tableY);
            
            tableY += 7;
            pdf.setFont(undefined, 'normal');
            pdf.setFontSize(10);
            pdf.text(`Lavadoras: ${totais.totalLavadoras}`, startX + 10, tableY);
            pdf.text(`Refrigeradores: ${totais.totalRefrigeradores}`, startX + 80, tableY);
            
            // Rodapé
            pdf.setFontSize(8);
            pdf.setTextColor(100, 100, 100);
            pdf.text(`Gerado em: ${new Date().toLocaleString('pt-BR')}`, pageWidth / 2, 290, { align: 'center' });
            
            pdf.save(`floorshare_${dados.data.replace(/\//g, '_')}.pdf`);
        }

        document.getElementById('generate-report').addEventListener('click', function() {
            const brandsData = coletarDadosMarcas();
            const totais = calcularTotais(brandsData);

            if (totais.totalGeral === 0) {
                alert("Por favor, adicione pelo menos uma quantidade válida em qualquer categoria.");
                return;
            }

            const dados = {
                rede: document.getElementById('rede').value || "Não informado",
                idRede: document.getElementById('id-rede').value || "Não informado",
                filial: document.getElementById('filial').value || "Não informado",
                cidade: document.getElementById('cidade').value || "Não informado",
                coordenador: document.getElementById('coordenador').value || "Não informado",
                consultor: document.getElementById('consultor').value || "Não informado",
                regional: document.getElementById('regional').value || "Não informado",
                data: formatarData(document.getElementById('data').value),
                observacoes: document.getElementById('observacoes').value
            };

            // Atualizar visual summary
            document.getElementById('visual-summary').innerHTML = gerarResumoVisual(brandsData, totais);

            // Gerar relatório completo
            const relatorioTexto = gerarRelatorioTexto(dados, brandsData, totais);
            document.getElementById('pdf-preview').textContent = relatorioTexto;
            
            // Atualizar link do WhatsApp
            document.getElementById('whatsapp-link').href = `https://wa.me/?text=${encodeURIComponent(relatorioTexto)}`;
            
            // Configurar evento para gerar PDF
            document.getElementById('generate-pdf').onclick = () => {
                gerarPDF(dados, brandsData, totais);
            };

            document.getElementById('result-modal').classList.remove('hidden');
        });

        document.getElementById('close-modal').addEventListener('click', () => {
            document.getElementById('result-modal').classList.add('hidden');
        });

        document.getElementById('reset-top').addEventListener('click', () => {
            if(confirm('Limpar todos os campos?')) {
                // Limpar inputs
                document.querySelectorAll('input[type="text"], input[type="number"], textarea').forEach(el => {
                    el.value = '';
                });
                
                document.getElementById('data').valueAsDate = new Date();
                
                // Resetar marcas (mantém apenas Panasonic)
                const container = document.getElementById('brands-container');
                const panasonicDiv = container.querySelector('.brand-category:first-child');
                container.innerHTML = '';
                container.appendChild(panasonicDiv);
                
                // Resetar inputs do Panasonic
                panasonicDiv.querySelectorAll('input[type="number"]').forEach(input => {
                    input.value = '';
                });
            }
        });

        // Focar no primeiro campo ao carregar
        document.getElementById('rede').focus();
    </script>
</body>
</html>
